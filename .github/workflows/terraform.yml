name: 'Terraform'

on:
  workflow_call:
    inputs:
      terraform-version:
        required: false
        type: string
        default: latest
      directory:
        required: false
        type: string
        default: '.'
      test-dir:
        required: false
        type: string
        default: ''

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.DEFAULT_JOB_TIMEOUT_MINUTES) }}

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --recursive --chdir=${{ inputs.directory }} -f compact
      - name: Trivy config scan
        env:
          SCAN_DIR: ${{ inputs.directory }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            ghcr.io/aquasecurity/trivy:0.76.1 config "$SCAN_DIR"
      - run: terraform -chdir=${{ inputs.directory }} fmt -check -diff -recursive
      - run: terraform -chdir=${{ inputs.test-dir || inputs.directory }} init -backend=false
      - run: terraform -chdir=${{ inputs.test-dir || inputs.directory }} validate
